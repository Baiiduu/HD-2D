# Included by nginx's http block. Certificates/configuration live outside releases.
limit_req_zone $binary_remote_addr zone=hd2d_leaderboard:1m rate=5r/s;

server {
    listen 18443 ssl;
    server_name _;
    ssl_certificate /etc/hd2d-leaderboard/server.crt;
    ssl_certificate_key /etc/hd2d-leaderboard/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HD2D_TLS:1m;
    client_max_body_size 16k;
    limit_req zone=hd2d_leaderboard burst=20 nodelay;
    limit_req_status 429;

    location = /health {
        proxy_pass http://127.0.0.1:18080;
    }
    location = /v1/demo/scores {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /v1/leaderboards {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080;
    }
    location / { return 404; }
}
